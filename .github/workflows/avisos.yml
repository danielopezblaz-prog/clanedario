# Despertador de los avisos de Clanedario Proyecton.
# El hosting de proyecton.es no tiene cron: cada 5 minutos esto llama a avisos.php, que manda los avisos
# «push» a los móviles (aunque la app esté cerrada). avisos.php no necesita usuario ni devuelve datos de nadie.
# GitHub puede retrasar unos minutos las ejecuciones programadas; por eso avisos.php adelanta hasta 5 minutos.
name: avisos
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar a avisos.php
        run: curl -fsS --max-time 60 https://proyecton.es/preston/clanedario/avisos.php || true
