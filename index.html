<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clanedario">
<meta name="description" content="Clanedario: tareas, calendario y recordatorios de reuniones.">
<title>Clanedario</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/><path d="M15 15l3 3 3-3M18 11v7"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13l2-8h12l2 8v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h5l1.5 2.5h3L15 13h5"/></symbol>
  <symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0v4l2 3H4l2-3z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4M21 13v3a2 2 0 0 1-2 2H3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4h12l-2.5 4.5L17 13H5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M13.5 8.5l3 3"/></symbol>
  <symbol id="i-zzz" viewBox="0 0 24 24"><path d="M5 9h5l-5 6h5M13 5h4l-4 5h4M15 15h4l-4 4h4"/></symbol>
</svg>

<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><svg><use href="#i-check"/></svg></div>
      <div><div class="brand-name">Clanedario</div><div class="brand-sub" id="brandDate"></div></div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-btn" data-view="today"><span class="nav-ic c-blue"><svg><use href="#i-sun"/></svg></span><span>Hoy</span><b class="badge" id="badgeToday"></b></button>
      <button class="nav-btn" data-view="upcoming"><span class="nav-ic c-red"><svg><use href="#i-next"/></svg></span><span>Próximos</span></button>
      <button class="nav-btn" data-view="calendar"><span class="nav-ic c-purple"><svg><use href="#i-cal"/></svg></span><span>Calendario</span></button>
      <button class="nav-btn" data-view="all"><span class="nav-ic c-gray"><svg><use href="#i-inbox"/></svg></span><span>Todo pendiente</span><b class="badge soft" id="badgeAll"></b></button>
      <button class="nav-btn" data-view="done"><span class="nav-ic c-green"><svg><use href="#i-done"/></svg></span><span>Completadas</span></button>
    </nav>
    <div class="side-head"><span>Mis listas</span><button class="icon-btn sm" id="addList" title="Nueva lista"><svg><use href="#i-plus"/></svg></button></div>
    <nav class="nav lists" id="listNav"></nav>
    <div class="mini" id="miniCal"></div>
    <div class="side-foot">
      <button class="icon-btn" id="themeBtn" title="Tema claro / oscuro"><svg><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="notifBtn" title="Avisos del sistema"><svg><use href="#i-bell"/></svg></button>
      <button class="icon-btn" id="settingsBtn" title="Ajustes"><svg><use href="#i-gear"/></svg></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="quick" id="quick">
        <svg class="quick-ic"><use href="#i-plus"/></svg>
        <input id="quickInput" type="text" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="Añadir… p. ej. «Reunión con Dani mañana 10:30 #trabajo !alta»">
        <div class="quick-chips" id="quickChips"></div>
        <kbd class="quick-kbd">N</kbd>
      </div>
      <div class="next-up" id="nextUp"></div>
      <button class="icon-btn" id="searchBtn" title="Buscar (Ctrl+K)"><svg><use href="#i-search"/></svg></button>
      <button class="btn primary" id="newBtn"><svg><use href="#i-plus"/></svg><span>Nuevo</span></button>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-view="today"><svg><use href="#i-sun"/></svg><span>Hoy</span></button>
  <button data-view="upcoming"><svg><use href="#i-next"/></svg><span>Próximos</span></button>
  <button data-view="calendar"><svg><use href="#i-cal"/></svg><span>Calendario</span></button>
  <button data-view="all"><svg><use href="#i-inbox"/></svg><span>Pendiente</span></button>
  <button data-act="more"><svg><use href="#i-more"/></svg><span>Más</span></button>
</nav>

<div class="overlay hidden" id="sheetWrap"><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="overlay search-wrap hidden" id="searchWrap"><div class="search" id="search"><div class="search-in"><svg><use href="#i-search"/></svg><input id="searchInput" placeholder="Buscar tareas, reuniones, notas…" autocomplete="off"><kbd>Esc</kbd></div><div class="search-res" id="searchRes"></div></div></div>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
