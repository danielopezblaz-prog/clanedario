<link rel="manifest" href="manifest.webmanifest">

<body>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="./" title="Clanedario">
      <span class="brand-mark"><svg class="brand-check"><use href="#i-check"/></svg><img id="brandIcon" alt="" hidden></span>
      <span class="brand-text">
        <img id="brandLogo" class="brand-logo" alt="Revestimientos Proyecton" hidden>
        <b class="brand-name">Clanedario</b>
        <small class="brand-sub" id="brandDate"></small>
      </span>
    </a>
    <nav class="nav" id="nav">
      <div class="nav-label srv-only hidden">Mi trabajo</div>
      <button class="nav-btn" data-bloque="trabajo" data-view="today"><span>Hoy</span><b class="badge" id="badgeToday"></b></button>
      <button class="nav-btn" data-bloque="trabajo" data-view="upcoming"><span>Próximos</span></button>
      <button class="nav-btn" data-bloque="trabajo" data-view="calendar"><span>Calendario</span></button>
      <button class="nav-btn" data-bloque="trabajo" data-view="all"><span>Tareas</span><b class="badge soft" id="badgeAll"></b></button>
      <div class="nav-label srv-only hidden">Equipo</div>
      <button class="nav-btn srv-only hidden" data-bloque="equipo" data-view="equipo"><span>Equipo</span></button>
      <button class="nav-btn srv-only hidden" data-bloque="equipo" data-view="semana"><span>Semana del equipo</span></button>
      <button class="nav-btn srv-only hidden" data-bloque="equipo" data-view="panel"><span>Panel</span></button>
      <div class="nav-label srv-only hidden">Obras</div>
      <button class="nav-btn srv-only hidden" data-bloque="obras" data-view="obras" data-views="obras obra"><span>Obras</span></button>
      <button class="nav-btn srv-only hidden" data-bloque="obras" data-view="tablero"><span>Tablero</span></button>
      <button class="nav-btn srv-only hidden" data-bloque="obras" data-view="captacion"><span>Captación</span><b class="badge soft" id="badgeCrm"></b></button>
    </nav>
    <div class="side-head"><span>Mis listas</span><button class="side-add" id="addList" title="Crear una lista">Nueva</button></div>
    <nav class="nav lists" id="listNav"></nav>
    <div class="side-head srv-only hidden"><span>Apps de Proyecton</span></div>
    <nav class="nav apps-nav srv-only hidden" id="appsNav"></nav>
    <div class="mini" id="miniCal"></div>
    <div class="side-foot">
      <div class="me srv-only hidden" id="me"></div>
      <div class="foot-links">
        <button class="foot-link" id="themeBtn" title="Cambiar entre tema claro y oscuro">Tema oscuro</button>
        <button class="foot-link" id="settingsBtn">Ajustes</button>
        <a class="foot-link srv-only hidden" id="salirBtn" href="#">Salir</a>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="band hidden" id="band"></div>
    <header class="topbar">
      <div class="quick" id="quick">
        <input id="quickInput" type="text" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="Añadir… p. ej. «Reunión con Dani mañana 10:30 #trabajo !alta»">
        <div class="quick-chips" id="quickChips"></div>
        <kbd class="quick-kbd">N</kbd>
      </div>
      <button class="scope srv-only hidden" id="scopeBtn" data-act="scope" title="De quién ves las tareas"></button>
      <div class="next-up" id="nextUp"></div>
      <button class="btn" id="searchBtn" title="Buscar en todo (Ctrl+K)">Buscar</button>
      <button class="btn" id="notifBtn" title="Avisos">Avisos</button>
      <button class="btn primary" id="newBtn"><span>Nuevo</span></button>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-bloque="trabajo" data-view="today"><span>Hoy</span></button>
  <button data-bloque="trabajo" data-view="upcoming"><span>Próximos</span></button>
  <button data-bloque="trabajo" data-view="calendar"><span>Calendario</span></button>
  <button data-bloque="trabajo" data-view="all"><span>Tareas</span></button>
  <button data-act="more"><span>Más</span></button>
</nav>

<div class="overlay hidden" id="sheetWrap"><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="overlay search-wrap hidden" id="searchWrap"><div class="search" id="search"><div class="search-in"><input id="searchInput" placeholder="Buscar tareas, reuniones, notas, obras…" autocomplete="off"><kbd>Esc</kbd></div><div class="search-res" id="searchRes"></div></div></div>
<div class="toasts" id="toasts"></div>
<!--USUARIO-->
<script src="app.js"></script>
</body>
</html>
